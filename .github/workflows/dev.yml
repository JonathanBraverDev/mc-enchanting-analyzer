name: Dev Branch CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps
    - run: npm run build
    - run: npm test

  pre-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Detect Feature Tag
      id: check
      run: |
        TAG_NAME=$(git tag --points-at HEAD | head -n 1)
        if [ -n "$TAG_NAME" ]; then
          echo "HAS_TAG=true" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
        else
          echo "HAS_TAG=false" >> $GITHUB_OUTPUT
        fi

    - name: Create Pre-release
      if: steps.check.outputs.HAS_TAG == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.check.outputs.TAG_NAME }}
        files: dist/analyzer-standalone.html
        prerelease: true
        body: |
          # Development Snapshot: ${{ steps.check.outputs.TAG_NAME }}
          *Experimental feature snapshot from dev branch.*
        name: "Dev Preview: ${{ steps.check.outputs.TAG_NAME }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
