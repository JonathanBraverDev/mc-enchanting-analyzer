name: Release Automation

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  validate:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Release: v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract Version
        id: get_version
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          TAG=$(echo "$TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Verify Changelog Update
        run: |
          PROPOSED_TAG="${{ steps.get_version.outputs.tag }}"
          if ! grep -q "## \[$PROPOSED_TAG\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md does not contain an entry for $PROPOSED_TAG"
            exit 1
          fi

      - name: Validate SemVer Jump
        run: |
          git fetch origin main --tags
          LATEST_TAG=$(git tag -l "v*" --sort=v:refname | tail -n 1)
          PROPOSED_TAG="${{ steps.get_version.outputs.tag }}"
          if [ -n "$LATEST_TAG" ]; then
            NEXT_PATCH=$(npx semver -i patch $LATEST_TAG)
            NEXT_MINOR=$(npx semver -i minor $LATEST_TAG)
            NEXT_MAJOR=$(npx semver -i major $LATEST_TAG)
            if [ "$PROPOSED_TAG" != "$NEXT_PATCH" ] && \
               [ "$PROPOSED_TAG" != "$NEXT_MINOR" ] && \
               [ "$PROPOSED_TAG" != "$NEXT_MAJOR" ]; then
              echo "ERROR: Invalid version jump from $LATEST_TAG to $PROPOSED_TAG."
              exit 1
            fi
          fi

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run build:standalone
      - name: Create Release and Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          files: dist/analyzer-standalone.html
          generate_release_notes: true
          name: "Release ${{ needs.validate.outputs.tag }}"
          body: ${{ github.event.pull_request.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-dev:
    needs: [validate, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebase Dev onto Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main dev
          git checkout dev
          
          echo "Attempting to rebase dev onto main..."
          if git rebase origin/main; then
            echo "Rebase successful. Force-pushing dev..."
            git push origin dev --force
          else
            echo "CONFLICT DETECTED: Rebase failed. Please resolve manually."
            exit 1
          fi

      - name: Cleanup Release Branch
        if: success()
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          if [[ "$BRANCH_NAME" == release/* ]]; then
            git push origin --delete "$BRANCH_NAME"
          fi
