name: Release Pre-Merge Check

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    name: Validate Release Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SemVer Tool
        run: npm install semver --no-save

      - name: Debug Information
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR Title: '$PR_TITLE'"
          git tag -l "v[0-9]*"

      - name: Check PR Title
        id: check_title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TITLE="$PR_TITLE"
          if [[ ! "$TITLE" =~ ^Release:\ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::PR title must follow the pattern 'Release: vX.Y.Z' (current: '$TITLE')"
            exit 1
          fi
          TAG=$(echo "$TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check PR Description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BODY="$PR_BODY"
          if [ -z "$BODY" ] || [ ${#BODY} -lt 10 ]; then
            echo "::error::PR description is too short or empty. Please provide release notes (minimum 10 characters)."
            exit 1
          fi

      - name: Verify Changelog
        run: |
          PROPOSED_TAG="${{ steps.check_title.outputs.tag }}"
          echo "Searching for entry for $PROPOSED_TAG in CHANGELOG.md..."
          if ! grep -q "## \[$PROPOSED_TAG\]" CHANGELOG.md && ! grep -q "## $PROPOSED_TAG" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain a header for $PROPOSED_TAG (expected '## [$PROPOSED_TAG]' or '## $PROPOSED_TAG')"
            exit 1
          fi

      - name: Verify Package Version
        run: |
          PROPOSED_TAG="${{ steps.check_title.outputs.tag }}"
          PROPOSED_VERSION="${PROPOSED_TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          LOCK_ROOT_VERSION=$(node -p "require('./package-lock.json').packages[''].version")

          if [ "$PACKAGE_VERSION" != "$PROPOSED_VERSION" ]; then
            echo "::error::package.json version $PACKAGE_VERSION does not match $PROPOSED_TAG"
            exit 1
          fi

          if [ "$LOCK_VERSION" != "$PROPOSED_VERSION" ] || [ "$LOCK_ROOT_VERSION" != "$PROPOSED_VERSION" ]; then
            echo "::error::package-lock.json versions do not match $PROPOSED_TAG"
            exit 1
          fi

      - name: Validate SemVer Jump
        run: |
          git fetch origin main --tags || true
          LATEST_TAG=$(git tag -l "v[0-9]*" --sort=v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tail -n 1)
          PROPOSED_TAG="${{ steps.check_title.outputs.tag }}"

          if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "$PROPOSED_TAG" ]; then
            # Use local semver for speed and silence
            P=$(npx semver -i patch $LATEST_TAG)
            M=$(npx semver -i minor $LATEST_TAG)
            J=$(npx semver -i major $LATEST_TAG)

            if [ "$PROPOSED_TAG" != "v$P" ] && [ "$PROPOSED_TAG" != "$P" ] && \
               [ "$PROPOSED_TAG" != "v$M" ] && [ "$PROPOSED_TAG" != "$M" ] && \
               [ "$PROPOSED_TAG" != "v$J" ] && [ "$PROPOSED_TAG" != "$J" ]; then
              echo "::error::Invalid version jump. From $LATEST_TAG, the next version should be v$P, v$M, or v$J."
              exit 1
            fi
          fi
          echo "SemVer jump validation successful."

      - name: Verify Release Documentation
        run: |
          git fetch origin main --tags || true
          LATEST_TAG=$(git tag -l "v[0-9]*" --sort=v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tail -n 1)
          PROPOSED_TAG="${{ steps.check_title.outputs.tag }}"

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "$PROPOSED_TAG" ]; then
            echo "No previous semantic release tag found, or proposed tag already exists. Skipping documentation delta check."
            exit 0
          fi

          LATEST_VERSION="${LATEST_TAG#v}"
          PROPOSED_VERSION="${PROPOSED_TAG#v}"
          IFS=. read -r LATEST_MAJOR LATEST_MINOR LATEST_PATCH <<< "$LATEST_VERSION"
          IFS=. read -r PROPOSED_MAJOR PROPOSED_MINOR PROPOSED_PATCH <<< "$PROPOSED_VERSION"

          if [ "$PROPOSED_MAJOR" -gt "$LATEST_MAJOR" ]; then
            BUMP="major"
          elif [ "$PROPOSED_MAJOR" -eq "$LATEST_MAJOR" ] && [ "$PROPOSED_MINOR" -gt "$LATEST_MINOR" ]; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          CHANGED_FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "Detected release bump: $BUMP"
          echo "$CHANGED_FILES"

          if [ "$BUMP" = "patch" ]; then
            echo "Patch releases are exempt from documentation update requirements."
            exit 0
          fi

          CORE_DOC_PATTERN='^(README|MASS_HANDLING|CONTRIBUTING)\.md$'
          PROJECT_DOC_PATTERN='^(ARCHITECTURE|README|MASS_HANDLING|CONTRIBUTING)\.md$'

          if [ "$BUMP" = "major" ]; then
            if ! printf '%s\n' "$CHANGED_FILES" | grep -qx 'ARCHITECTURE.md'; then
              echo "::error::Major releases must update ARCHITECTURE.md."
              exit 1
            fi

            if ! printf '%s\n' "$CHANGED_FILES" | grep -Eq "$CORE_DOC_PATTERN"; then
              echo "::error::Major releases must update at least one additional top-level project doc: README.md, MASS_HANDLING.md, or CONTRIBUTING.md."
              exit 1
            fi

            echo "Major release documentation updates found."
            exit 0
          fi

          if ! printf '%s\n' "$CHANGED_FILES" | grep -Eq "$PROJECT_DOC_PATTERN"; then
            echo "::warning::Minor releases should update project docs when behavior, architecture, workflows, or user-facing capabilities changed."
          else
            echo "Minor release documentation updates found."
          fi

      - name: Verify Release History Is Ready
        if: ${{ success() }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/release-history:refs/remotes/origin/release-history" \
            "pull/${PR_NUMBER}/head:refs/remotes/origin/release-check-head"

          if ! git diff --quiet origin/main origin/release-history; then
            echo "::error::origin/release-history must match origin/main before this release merges. The archive is missing a previous production state."
            exit 1
          fi

          RELEASE_COMMIT_COUNT=$(git rev-list --count "${{ github.event.pull_request.base.sha }}..refs/remotes/origin/release-check-head")
          if [ "$RELEASE_COMMIT_COUNT" -lt 2 ]; then
            echo "::error::Release PRs should carry the full release branch history, not a pre-squashed single commit. Let the main PR squash happen at merge time."
            exit 1
          fi

          echo "origin/release-history is current with main, and the release PR carries branch history."
