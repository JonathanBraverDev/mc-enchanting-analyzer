<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Enchantment Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <aside>
        <div class="logo">🔮<span>Analyzer</span></div>

        <div class="control-group">
            <label for="v-select">Version</label>
            <select id="v-select"></select>
        </div>

        <div class="control-group">
            <label for="cat-select">Item Type</label>
            <select id="cat-select">
                <optgroup label="Armor">
                    <option value="helmet">Helmet</option>
                    <option value="chestplate">Chestplate</option>
                    <option value="leggings">Leggings</option>
                    <option value="boots">Boots</option>
                </optgroup>
                <optgroup label="Tools">
                    <option value="pickaxe" selected>Pickaxe</option>
                    <option value="axe">Axe</option>
                    <option value="shovel">Shovel</option>
                    <option value="hoe">Hoe</option>
                </optgroup>
                <optgroup label="Weapons">
                    <option value="sword" selected>Sword</option>
                    <option value="bow">Bow</option>
                    <option value="crossbow">Crossbow</option>
                    <option value="trident">Trident</option>
                    <option value="mace">Mace</option>
                    <option value="spear">Spear</option>
                </optgroup>
                <optgroup label="Other">
                    <option value="fishing_rod">Fishing Rod</option>
                    <option value="book">Book</option>
                </optgroup>
            </select>
        </div>

        <div class="control-group">
            <label for="mat-select">Material</label>
            <select id="mat-select"></select>
        </div>

        <div class="control-group">
            <label for="clue-select">Shown in Table</label>
            <select id="clue-select">
                <option value="">Random</option>
            </select>
        </div>

        <div class="control-group">
            <label for="target-select">Target Combination</label>
            <div class="target-picker">
                <select id="target-select"></select>
                <button id="target-add" type="button" title="Add target">+</button>
            </div>
            <div id="target-list" class="target-list" aria-live="polite"></div>
        </div>

        <div class="control-group">
            <label for="lvl-range">Enchanting Level: <span id="lvl-val">30</span></label>
            <input type="range" id="lvl-range" min="1" max="30" value="30">
        </div>

        <div style="margin-top: auto; padding: 15px; background: rgba(125, 68, 255, 0.1); border-radius: 10px;">
            <div style="font-size: 0.7rem; color: var(--text-muted);">ENCHANTABILITY</div>
            <div id="ench-val" style="font-size: 1.5rem; font-weight: 800; color: var(--accent);">--</div>
        </div>
    </aside>

    <main>
        <header>
            <h1>Enchantment Probabilities</h1>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Exact mathematical simulation using the Minecraft stochastic engine.</p>
        </header>

        <section class="dashboard">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <h2 style="margin: 0; font-size: 1.1rem;">Probability Sweep</h2>
                        <span id="chart-status" style="font-size: 0.6rem; font-weight: 700; color: var(--text-muted); opacity: 0; transition: opacity 0.3s; text-transform: uppercase;"></span>
                    </div>
                    <select id="chart-metric" style="width: auto; padding-right: 35px;">
                        <option value="any">Any Enchantment</option>
                        <option value="ranks">Specific Ranks</option>
                        <option value="count">Enchantment Count</option>
                    </select>
                </div>
                <div class="chart-container">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <h2 id="results-title" style="font-size: 1.1rem; margin: 0;">Top Combinations</h2>
                        <span id="refinement-status" style="font-size: 0.65rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); color: var(--text-muted); transition: all 0.3s; opacity: 0; text-transform: uppercase; letter-spacing: 0.05em;">Coarse</span>
                    </div>
                    <select id="combo-sort" style="width: auto; padding-right: 35px; font-size: 0.75rem;">
                        <option value="prob">Highest Probability</option>
                        <option value="count">Most Enchantments</option>
                        <option value="rank">Highest Total Rank</option>
                        <option value="advisor">Best Clues</option>
                    </select>
                </div>
                <div id="combo-list" class="combo-list">
                    <!-- combos injected here -->
                </div>
            </div>
        </section>

        <section id="rank-section" class="rank-grid">
            <!-- ranks injected here -->
        </section>
    </main>

    <script src="../../dist/bundle.js"></script>
</body>
</html>
