name: Release Automation

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  validate:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Release: v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract Version
        id: get_version
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          TAG=$(echo "$TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          if [ -z "$TAG" ]; then
            echo "ERROR: Could not extract version from PR title: $TITLE"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Validate SemVer Jump
        run: |
          git fetch origin main --tags
          LATEST_TAG=$(git tag -l "v*" --sort=v:refname | tail -n 1)
          PROPOSED_TAG="${{ steps.get_version.outputs.tag }}"
          
          echo "Latest tag on main: $LATEST_TAG"
          echo "Proposed release tag: $PROPOSED_TAG"

          if [ -n "$LATEST_TAG" ]; then
            # Verify it's a valid jump (Patch, Minor, or Major)
            NEXT_PATCH=$(npx semver -i patch $LATEST_TAG)
            NEXT_MINOR=$(npx semver -i minor $LATEST_TAG)
            NEXT_MAJOR=$(npx semver -i major $LATEST_TAG)

            if [ "$PROPOSED_TAG" != "$NEXT_PATCH" ] && \
               [ "$PROPOSED_TAG" != "$NEXT_MINOR" ] && \
               [ "$PROPOSED_TAG" != "$NEXT_MAJOR" ]; then
              echo "ERROR: Invalid version jump. $PROPOSED_TAG is not a patch, minor, or major increment of $LATEST_TAG."
              exit 1
            fi
          fi

  # Note: The 'test' job is handled by dev-test.yml which runs on the PR before merge.
  # We rely on Branch Protection to ensure tests pass before this workflow triggers.

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - run: npm ci
      - run: npm run build:standalone

      - name: Create Release and Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          files: dist/analyzer-standalone.html
          generate_release_notes: true
          name: "Release ${{ needs.validate.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
