name: CI Change Advisory

on:
  pull_request_target:
    branches:
      - main
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-change-advisory:
    name: CI Change Advisory
    # This is intentionally target-branch only, so PR-authored workflow edits
    # cannot suppress or soften the advisory that reviews those same edits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Fetch PR head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "pull/${PR_NUMBER}/head:refs/remotes/origin/ci-advisory-head"

      - name: Classify CI changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          base=origin/main
          head=refs/remotes/origin/ci-advisory-head
          MARKER='<!-- ci-change-advisory -->'
          printf '%s\n' \
            "$MARKER" \
            '<!-- status:stale -->' \
            '### CI change advisory - stale' \
            '' \
            'Superseded by a newer CI change advisory.' \
            > /tmp/ci-change-advisory-stale.md

          printf '%s\n' \
            "$MARKER" \
            '<!-- status:resolved -->' \
            '### CI change advisory - resolved' \
            '' \
            'Resolved for the current PR state.' \
            > /tmp/ci-change-advisory-resolved.md
          post_active_comment() {
            node scripts/pr-marker-comment.cjs upsert \
              --repo "$REPOSITORY" \
              --pr "$PR_NUMBER" \
              --marker "$MARKER" \
              --body-file /tmp/ci-change-advisory.md \
              --stale-body-file /tmp/ci-change-advisory-stale.md
          }

          resolve_active_comment() {
            node scripts/pr-marker-comment.cjs resolve \
              --repo "$REPOSITORY" \
              --pr "$PR_NUMBER" \
              --marker "$MARKER" \
              --body-file /tmp/ci-change-advisory-resolved.md \
              --stale-body-file /tmp/ci-change-advisory-stale.md
          }

          set +e
          node scripts/classify-ci-changes.cjs "$base" "$head" \
            --body-file /tmp/ci-change-advisory-body.md \
            --json-file /tmp/ci-change-advisory.json
          advisory_status=$?
          set -e

          if [ "$advisory_status" -eq 0 ]; then
            resolve_active_comment
            echo "No CI-affecting behavior changes detected."
            exit 0
          fi

          if [ "$advisory_status" -ne 1 ]; then
            exit "$advisory_status"
          fi

          {
            printf '%s\n' "$MARKER" '<!-- status:active -->' '### CI change advisory' ''
            cat /tmp/ci-change-advisory-body.md
          } > /tmp/ci-change-advisory.md
          post_active_comment
          echo "::error title=CI behavior changed::This advisory is intentionally non-required; reviewers should inspect the CI-affecting behavior changes."
          cat /tmp/ci-change-advisory-body.md
          exit 1
