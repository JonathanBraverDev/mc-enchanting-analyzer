<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Enchantment Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0d11;
            --sidebar: rgba(255, 255, 255, 0.03);
            --card: rgba(255, 255, 255, 0.05);
            --accent: #7d44ff;
            --text: #f0f2f6;
            --text-muted: #a0a0a0;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 320px;
            background: var(--sidebar);
            border-right: 1px solid var(--glass-border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05rem;
        }

        select, input[type="range"] {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }

        /* Main Content */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background: radial-gradient(circle at top right, #1a1c24, var(--bg));
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            margin: 0 0 10px 0;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .chart-container {
            height: 400px;
            position: relative;
        }

        /* List Sections */
        .combo-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .combo-item {
            background: rgba(125, 68, 255, 0.08);
            border-left: 3px solid var(--accent);
            padding: 12px;
            border-radius: 6px;
        }

        .combo-names { font-size: 0.9rem; color: #ddd; }
        .combo-prob { font-weight: 800; color: var(--accent); }

        .rank-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .rank-item {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }

        .progress-bg {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
        }

        /* Responsive Improvements */
        @media (max-width: 1200px) {
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>

        // --- MATH UTILS ---
        function parseVersion(v) {
            return (v.match(/\d+/g) || []).map(Number);
        }

        function isVersionInRange(target, start, end = "99.9") {
            const t = parseVersion(target);
            const s = parseVersion(start);
            const e = parseVersion(end);
            
            const cmp = (a, b) => {
                for (let i = 0; i < Math.max(a.length, b.length); i++) {
                    const valA = a[i] || 0;
                    const valB = b[i] || 0;
                    if (valA > valB) return 1;
                    if (valA < valB) return -1;
                }
                return 0;
            };

            return cmp(t, s) >= 0 && cmp(t, e) <= 0;
        }

        function getRomanValue(r) {
            const map = { "I": 1, "II": 2, "III": 3, "IV": 4, "V": 5 };
            return map[r] || 0;
        }

        // --- CALCULATION ENGINE ---
        class EnchantEngine {
            constructor(data, version) {
                this.data = data;
                this.version = version;
                this.setupContext();
            }

            setupContext() {
                const versions = this.data.versions;
                const chain = [];
                let curr = this.version;

                // Robust version finding
                if (!versions[curr]) {
                    const sorted = Object.keys(versions).sort((a,b) => {
                        const pa = parseVersion(a), pb = parseVersion(b);
                        for(let i=0; i<Math.max(pa.length, pb.length); i++){
                            if((pa[i]||0) > (pb[i]||0)) return 1;
                            if((pa[i]||0) < (pb[i]||0)) return -1;
                        }
                        return 0;
                    });
                    for(let v of sorted) {
                        if(isVersionInRange(this.version, v)) curr = v;
                    }
                }

                let temp = curr;
                while(temp) {
                    chain.unshift(temp);
                    temp = versions[temp]?.extends;
                }

                this.mechanics = {};
                this.mergedItems = {};
                this.mergedOverrides = {};
                this.multiEnchantBooks = true;

                for(let vName of chain) {
                    const manifest = versions[vName];
                    if(!manifest) continue;

                    // Resolve items
                    for(let [cat, content] of Object.entries(manifest.item_enchantments || {})) {
                        let resolved = [];
                        content.forEach(item => {
                            if(this.data.enchantment_groups[item]) resolved.push(...this.data.enchantment_groups[item]);
                            else resolved.push(item);
                        });
                        this.mergedItems[cat] = [...new Set(resolved)];
                    }

                    // Mechanics
                    Object.assign(this.mechanics, manifest.mechanics || {});
                    if(manifest.multi_enchant_books !== undefined) this.multiEnchantBooks = manifest.multi_enchant_books;
                    
                    // Overrides
                    for(let [ench, props] of Object.entries(manifest.overrides || {})) {
                        this.mergedOverrides[ench] = Object.assign(this.mergedOverrides[ench] || {}, props);
                    }
                }
            }

            getEnchantability(mat, cat) {
                const armor = ["helmet", "chestplate", "leggings", "boots", "turtle_shell"];
                const values = this.data.material_values;
                const sub = armor.includes(cat) ? values.armor : values.tools;
                return sub[mat] || 10;
            }

            getModifiedLevelDist(xp, enchantability) {
                if (enchantability <= 0) return { [xp]: 1.0 };
                const div = this.mechanics.enchantability_bonus_divisor || 4;
                const rngRange = this.mechanics.random_bonus_range || 0.15;
                const N = Math.floor(enchantability / div) + 1;
                
                const baseDist = {};
                for(let i=0; i<N; i++) {
                    for(let j=0; j<N; j++) {
                        const val = xp + i + j + 1;
                        baseDist[val] = (baseDist[val] || 0) + 1 / (N*N);
                    }
                }

                const finalDist = {};
                const steps = 25; 
                for(let [base, bProb] of Object.entries(baseDist)) {
                    base = Number(base);
                    for(let i=0; i<steps; i++) {
                        for(let j=0; j<steps; j++) {
                            const bonus = (i/(steps-1) * rngRange) + (j/(steps-1) * rngRange) - rngRange;
                            const modVal = Math.max(1, Math.floor(base * (1 + bonus) + 0.5));
                            finalDist[modVal] = (finalDist[modVal] || 0) + (bProb / (steps*steps));
                        }
                    }
                }
                return finalDist;
            }

            calculateCombinations(cat, modLevel) {
                const cache = new Map();
                const registry = this.data.global_enchantments;

                const getEligibleList = (chosenNames, level) => {
                    const pool = this.mergedItems[cat] || [];
                    const out = [];
                    pool.forEach(name => {
                        if(chosenNames.has(name)) return;
                        const props = Object.assign({}, registry[name], this.mergedOverrides[name] || {});
                        if(!isVersionInRange(this.version, props.valid_from, props.valid_to)) return;
                        
                        // Check conflicts
                        for(let chosen of chosenNames) {
                            const cProps = Object.assign({}, registry[chosen], this.mergedOverrides[chosen] || {});
                            if(cProps.conflicts?.includes(name) || props.conflicts?.includes(chosen)) return;
                        }

                        let best = null;
                        ["V", "IV", "III", "II", "I"].forEach(r => {
                            if(!best && props.levels[r]) {
                                if(level >= props.levels[r][0] && level <= props.levels[r][1]) best = r;
                            }
                        });
                        if(best) out.push({ name, weight: props.weight, rank: best });
                    });
                    return out;
                };

                const solveProper = (chosen, level) => {
                    const key = chosen.slice().sort().join("|") + "@" + level;
                    if(cache.has(key)) return cache.get(key);

                    const chosenNames = new Set(chosen.map(e => e.split(" ")[0]));
                    const eligible = getEligibleList(chosenNames, level);
                    const totalWeight = eligible.reduce((s, e) => s + e.weight, 0);
                    const probContinue = (cat === "book" && !this.multiEnchantBooks) ? 0 : Math.min((level + 1) / 50, 1.0);

                    let results = {};
                    if(chosen.length === 0) {
                        eligible.forEach(e => {
                            const pWeight = e.weight / totalWeight;
                            const sub = solveProper([`${e.name} ${e.rank}`], level);
                            for(let [c, p] of Object.entries(sub)) results[c] = (results[c]||0) + pWeight * p;
                        });
                    } else {
                        const currentKey = chosen.slice().sort().join("+");
                        results[currentKey] = 1 - probContinue;
                        if(probContinue > 0 && eligible.length > 0) {
                            eligible.forEach(e => {
                                const pWeight = (e.weight / totalWeight) * probContinue;
                                const sub = solveProper([...chosen, `${e.name} ${e.rank}`], Math.floor(level / 2));
                                for(let [c, p] of Object.entries(sub)) results[c] = (results[c]||0) + pWeight * p;
                            });
                        } else {
                            results[currentKey] = 1.0;
                        }
                    }
                    cache.set(key, results);
                    return results;
                };

                return solveProper([], modLevel);
            }

            getFullStats(cat, xp, mat) {
                const enchantability = this.getEnchantability(mat, cat);
                const modDist = this.getModifiedLevelDist(xp, enchantability);
                const finalCombos = {};

                for(let [ml, mProb] of Object.entries(modDist)) {
                    if (mProb < 0.0001) continue; // Opt
                    const combos = this.calculateCombinations(cat, Number(ml));
                    for(let [c, p] of Object.entries(combos)) {
                        finalCombos[c] = (finalCombos[c] || 0) + p * mProb;
                    }
                }

                const stats = { ranks: {}, any: {}, count: {} };
                for(let [combo, p] of Object.entries(finalCombos)) {
                    const parts = combo.split("+");
                    const len = parts.length;
                    stats.count[len] = (stats.count[len] || 0) + p;
                    
                    const seen = new Set();
                    parts.forEach(entry => {
                        stats.ranks[entry] = (stats.ranks[entry] || 0) + p;
                        const base = entry.split(" ").slice(0, -1).join(" ");
                        if(!seen.has(base)) {
                            stats.any[base] = (stats.any[base] || 0) + p;
                            seen.add(base);
                        }
                    });
                }
                return stats;
            }
        }

        // --- UI SYNC ---
        let mainChart = null;
        let engine = null;

        function init() {
            const vSelect = document.getElementById("v-select");
            const catSelect = document.getElementById("cat-select");
            const matSelect = document.getElementById("mat-select");
            const lvlRange = document.getElementById("lvl-range");
            const lvlVal = document.getElementById("lvl-val");

            // Populate versions
            Object.keys(DATA.versions).reverse().forEach(v => {
                const o = document.createElement("option");
                o.value = v; o.textContent = v;
                vSelect.appendChild(o);
            });

            // Populate categories
            const cats = new Set(["pickaxe", "axe", "shovel", "sword", "bow", "helmet", "chestplate", "leggings", "boots", "trident", "crossbow", "mace", "spear", "fishing_rod", "book"]);
            cats.forEach(c => {
                const o = document.createElement("option");
                o.value = c; o.textContent = c;
                catSelect.appendChild(o);
            });

            const updateMaterials = () => {
                const cat = catSelect.value;
                const armor = ["helmet", "chestplate", "leggings", "boots", "turtle_shell"];
                const isArmor = armor.includes(cat);
                const currentMat = matSelect.value;
                matSelect.innerHTML = "";
                
                const mats = isArmor ? DATA.material_values.armor : DATA.material_values.tools;
                Object.keys(mats).sort().forEach(m => {
                    const o = document.createElement("option");
                    o.value = m; o.textContent = m;
                    if(m === "diamond" || m === currentMat) o.selected = true;
                    matSelect.appendChild(o);
                });
            };

            const run = () => {
                const v = vSelect.value;
                const cat = catSelect.value;
                const mat = matSelect.value;
                const xp = parseInt(lvlRange.value);
                lvlVal.textContent = xp;

                engine = new EnchantEngine(DATA, v);
                document.getElementById("ench-val").textContent = engine.getEnchantability(mat, cat);

                const stats = engine.getFullStats(cat, xp, mat);
                updateInsights(stats);
                updateChart(cat, mat, v);
            };

            vSelect.onchange = run;
            catSelect.onchange = () => { updateMaterials(); run(); };
            matSelect.onchange = run;
            lvlRange.oninput = () => { lvlVal.textContent = lvlRange.value; };
            lvlRange.onchange = run;
            document.getElementById("chart-metric").onchange = run;

            updateMaterials();
            run();
        }

        function updateInsights(stats) {
            const comboEl = document.getElementById("combo-list");
            const ranks = Object.entries(stats.ranks).sort((a,b) => b[1] - a[1]).slice(0, 10);
            comboEl.innerHTML = ranks.map(([name, prob]) => `
                <div class="combo-item">
                    <div style="display: flex; justify-content: space-between;">
                        <span class="combo-names">${name}</span>
                        <span class="combo-prob">${(prob * 100).toFixed(1)}%</span>
                    </div>
                </div>
            `).join("");

            const rankSection = document.getElementById("rank-section");
            rankSection.innerHTML = Object.entries(stats.any).sort((a,b) => b[1] - a[1]).map(([name, prob]) => `
                <div class="rank-item">
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
                        <span>Any ${name}</span>
                        <span style="font-weight:700;">${(prob*100).toFixed(1)}%</span>
                    </div>
                    <div class="progress-bg"><div class="progress-fill" style="width: ${prob*100}%"></div></div>
                </div>
            `).join("");
        }

        function updateChart(cat, mat, v) {
            const metric = document.getElementById("chart-metric").value;
            const labels = Array.from({length: 30}, (_, i) => i + 1);
            const datasets = [];

            // Sweep - note: Full sweep is expensive in JS recursion, we might sample
            const sweep = labels.filter(l => l % 2 === 0 || l === 1 || l === 30).map(l => ({ l, s: engine.getFullStats(cat, l, mat) }));
            const chartLabels = sweep.map(x => x.l);

            if(metric === "any") {
                const firstStats = sweep[sweep.length-1].s;
                Object.keys(firstStats.any).forEach(k => {
                    datasets.push({
                        label: k,
                        data: sweep.map(x => (x.s.any[k] || 0) * 100),
                        borderWidth: 2, tension: 0.3, pointRadius: 2
                    });
                });
            } else {
                [1,2,3,4].forEach(c => {
                    datasets.push({
                        label: c + (c===1?" Enchant":" Enchants"),
                        data: sweep.map(x => (x.s.count[c] || 0) * 100),
                        borderWidth: 2, tension: 0.3, pointRadius: 2
                    });
                });
            }

            if(mainChart) mainChart.destroy();
            const ctx = document.getElementById("mainChart").getContext("2d");
            mainChart = new Chart(ctx, {
                type: 'line',
                data: { labels: chartLabels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { grid: { color: 'rgba(255,255,255,0.05)' } }
                    },
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#ccc', font: { size: 10 }, boxWidth: 10 } }
                    }
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
