name: Release & Sync

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Create Tag and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Version from commit message
        id: get_version
        run: |
          TITLE=$(git log -1 --pretty=%s)
          TAG=$(echo "$TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          if [ -z "$TAG" ]; then
            echo "No version found in commit message. Skipping release."
            exit 0
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Tag
        if: steps.get_version.outputs.tag != ''
        run: |
          TAG=${{ steps.get_version.outputs.tag }}
          git tag $TAG
          git push origin $TAG

      - name: Create Release
        if: steps.get_version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.tag }}
          body: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false

  sync-dev:
    name: Sync Dev Branch
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Main into Dev
        run: |
          git fetch origin main
          # Use merge instead of rebase to preserve detailed history alongside milestones
          git merge origin/main -m "sync: auto-align dev with production milestone"
          git push origin dev
