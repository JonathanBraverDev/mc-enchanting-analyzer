name: Release & Archive

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to archive, for example v5.2.0'
        required: true
        type: string
      pr_number:
        description: 'Release PR number whose head should be archived'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Tag and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
      pr_number: ${{ steps.version.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from main commit
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$DISPATCH_TAG" ] || [ -z "$DISPATCH_PR_NUMBER" ]; then
              echo "::error::Manual archive runs require tag and pr_number inputs."
              exit 1
            fi

            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
            echo "pr_number=$DISPATCH_PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SUBJECT=$(git log -1 --pretty=%s)
          TAG=$(printf '%s\n' "$SUBJECT" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          PR_NUMBER=$(printf '%s\n' "$SUBJECT" | grep -oE '#[0-9]+' | tail -n 1 | tr -d '#' || true)

          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              -H "Accept: application/vnd.github+json" \
              --jq 'map(select(.base.ref == "main" and .merged_at != null)) | sort_by(.merged_at) | last | .number // ""' || true)
          fi

          if [ -z "$TAG" ]; then
            echo "No semantic version found in main commit subject: $SUBJECT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 22.x
        if: steps.version.outputs.should_release == 'true' && github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Build standalone release asset
        if: steps.version.outputs.should_release == 'true' && github.event_name == 'push'
        run: |
          npm ci
          npm run build:standalone
          test -s dist/analyzer-standalone.html

      - name: Extract release notes
        id: release_notes
        if: steps.version.outputs.should_release == 'true' && github.event_name == 'push'
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          awk -v tag="$TAG" '
            $0 ~ "^## \\[?" tag "\\]?" { found=1; next }
            /^## / { if (found) exit }
            found { print }
          ' CHANGELOG.md | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > release-notes.md

          if [ ! -s release-notes.md ]; then
            git log -1 --pretty=%B > release-notes.md
          fi

          RELEASE_TITLE=$(node - "$TAG" <<'NODE'
          const fs = require('fs');
          const {
            extractChangelogEntry,
            extractMajorReleaseName,
          } = require('./scripts/release-changelog-policy.cjs');

          const tag = process.argv[2];
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const entry = extractChangelogEntry(changelog, tag);
          const releaseName = entry ? extractMajorReleaseName(entry) : null;
          process.stdout.write(releaseName ? `${tag}: ${releaseName}` : `Release ${tag}`);
          NODE
          )

          echo "title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Create or verify tag
        if: steps.version.outputs.should_release == 'true' && github.event_name == 'push'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${{ github.sha }}"
          REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')

          if [ -n "$REMOTE_SHA" ]; then
            if [ "$REMOTE_SHA" != "$SHA" ]; then
              echo "::error::Tag $TAG already exists at $REMOTE_SHA, expected $SHA"
              exit 1
            fi
            echo "Tag $TAG already exists at this commit."
          else
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create or update GitHub Release
        if: steps.version.outputs.should_release == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/analyzer-standalone.html --clobber
            gh release edit "$TAG" \
              --title "${{ steps.release_notes.outputs.title }}" \
              --notes-file release-notes.md \
              --latest \
              --draft=false \
              --verify-tag
          else
            gh release create "$TAG" dist/analyzer-standalone.html \
              --title "${{ steps.release_notes.outputs.title }}" \
              --notes-file release-notes.md \
              --latest \
              --verify-tag
          fi

  archive-release-history:
    name: Archive Release History
    needs: release
    if: needs.release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Archive release branch head
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          PR_NUMBER="${{ needs.release.outputs.pr_number }}"
          RELEASE_REF="origin/main"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_REF="refs/tags/$TAG"
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Could not find the release PR number in the main squash commit subject."
            exit 1
          fi

          git fetch origin \
            "+refs/heads/release-history:refs/remotes/origin/release-history" \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${TAG}:refs/tags/${TAG}" \
            "pull/${PR_NUMBER}/head:refs/remotes/origin/release-branch-head"

          if ! git diff --quiet "$RELEASE_REF" refs/remotes/origin/release-branch-head; then
            echo "::error::Release branch head does not match the released tree."
            exit 1
          fi

          RELEASE_BASE=$(git merge-base "$RELEASE_REF" refs/remotes/origin/release-branch-head)
          if [ -z "$RELEASE_BASE" ]; then
            echo "::error::Could not find a shared base between the released tree and the release PR head."
            exit 1
          fi

          if ! git diff --quiet "$RELEASE_BASE" origin/release-history; then
            echo "::error::release-history must match the release PR base tree before archiving."
            exit 1
          fi

          mapfile -t RELEASE_COMMITS < <(git rev-list --reverse "$RELEASE_BASE"..refs/remotes/origin/release-branch-head)
          TRANSFERRED_TAGS=()

          git switch --detach origin/release-history
          for RELEASE_COMMIT in "${RELEASE_COMMITS[@]}"; do
            git cherry-pick "$RELEASE_COMMIT"
            ARCHIVED_COMMIT=$(git rev-parse HEAD)

            mapfile -t COMMIT_TAGS < <(git tag --points-at "$RELEASE_COMMIT" | grep -Ev '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
            for COMMIT_TAG in "${COMMIT_TAGS[@]}"; do
              git tag -f "$COMMIT_TAG" "$ARCHIVED_COMMIT"
              TRANSFERRED_TAGS+=("$COMMIT_TAG")
              echo "Mapped tag $COMMIT_TAG from $RELEASE_COMMIT to archived commit $ARCHIVED_COMMIT."
            done
          done

          if ! git diff --quiet HEAD "$RELEASE_REF"; then
            echo "::error::Archived release history does not match the released tree."
            exit 1
          fi

          git push origin "HEAD:refs/heads/release-history"
          for TRANSFERRED_TAG in "${TRANSFERRED_TAGS[@]}"; do
            git push --force origin "refs/tags/$TRANSFERRED_TAG"
          done

      - name: Delete archived release branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.release.outputs.pr_number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          HEAD_OWNER=$(gh pr view "$PR_NUMBER" --json headRepositoryOwner --jq '.headRepositoryOwner.login')
          HEAD_REF=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')

          if [ "$HEAD_OWNER" != "$REPOSITORY_OWNER" ]; then
            echo "Skipping branch deletion for fork-owned PR branch $HEAD_OWNER:$HEAD_REF."
            exit 0
          fi

          case "$HEAD_REF" in
            main|release-history|"")
              echo "::error::Refusing to delete protected or empty branch name: '$HEAD_REF'"
              exit 1
              ;;
          esac

          if git ls-remote --exit-code --heads origin "$HEAD_REF" >/dev/null 2>&1; then
            git push origin --delete "$HEAD_REF"
          else
            echo "Branch '$HEAD_REF' is already deleted."
          fi
