name: Node.js CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Skip matrix build for tag pushes — the branch push already tested this commit
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps
    - run: npm run build
    - run: npm test

  release:
    # Runs independently on tag pushes — no need to duplicate the build matrix
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Verify Branch
      run: |
        git fetch origin main
        if ! git branch -r --contains ${{ github.sha }} | grep -q "origin/main"; then
          echo "ERROR: Tag ${{ github.ref_name }} is not on the main branch."
          exit 1
        fi
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps
    - run: npm run build
    - run: npm test
    - run: npm run build:standalone
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/analyzer-standalone.html
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        name: "Portable Analyzer Release (${{ github.ref_name }})"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
