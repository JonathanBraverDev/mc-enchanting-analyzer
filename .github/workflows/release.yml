name: Release Automation

on:
  push:
    branches:
      - dev

jobs:
  validate:
    name: Validate Release
    if: startsWith(github.event.head_commit.message, 'Release: v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.body }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate Release Version
      id: version
      run: |
        git fetch origin main --tags
        
        # 1. Extract version from commit message
        MESSAGE="${{ github.event.head_commit.message }}"
        PROPOSED_TAG=$(echo "$MESSAGE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
        
        if [ -z "$PROPOSED_TAG" ]; then
          echo "ERROR: Could not extract version from message: $MESSAGE"
          echo "Expected format: Release: vX.Y.Z"
          exit 1
        fi
        
        echo "Proposed Tag: $PROPOSED_TAG"
        
        # 2. Get latest tag from main
        LATEST_TAG=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || echo "v0.0.0")
        echo "Latest tag on main: $LATEST_TAG"
        
        # 3. Strict SemVer Continuity Check
        # Check if proposed is exactly the next patch, minor, or major
        NEXT_PATCH=$(npx semver -i patch $LATEST_TAG)
        NEXT_MINOR=$(npx semver -i minor $LATEST_TAG)
        NEXT_MAJOR=$(npx semver -i major $LATEST_TAG)
        
        if [ "$PROPOSED_TAG" != "v$NEXT_PATCH" ] && [ "$PROPOSED_TAG" != "v$NEXT_MINOR" ] && [ "$PROPOSED_TAG" != "v$NEXT_MAJOR" ]; then
          echo "ERROR: Version jump detected or downgrade attempted."
          echo "Proposed: $PROPOSED_TAG"
          echo "Allowed next versions after $LATEST_TAG are:"
          echo "  - Patch: v$NEXT_PATCH"
          echo "  - Minor: v$NEXT_MINOR"
          echo "  - Major: v$NEXT_MAJOR"
          exit 1
        fi
        
        echo "tag=$PROPOSED_TAG" >> $GITHUB_OUTPUT

    - name: Extract Changelog
      id: changelog
      run: |
        TAG="${{ steps.version.outputs.tag }}"
        
        CHANGELOG=$(awk -v tag="$TAG" '
          $0 ~ "^## " tag { found=1; next }
          /^## v/ { if (found) exit }
          found { print }
        ' CHANGELOG.md | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
        
        if [ -z "$CHANGELOG" ]; then
          echo "ERROR: Could not extract changelog for $TAG. Is it missing or empty in CHANGELOG.md?"
          exit 1
        fi
        
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "body<<$EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT


  test:
    name: Run Tests
    needs: validate
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps
    - run: npm run build
    - run: npm test


  sync_and_release:
    name: Sync & Publish
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Build Standalone Artifact
      run: |
        npm ci
        npm run build
        npm run build:standalone

    - name: Squash Sync to Main
      env:
        CHANGELOG_BODY: ${{ needs.validate.outputs.changelog }}
        RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      run: |
        # Fetch latest branches
        git fetch origin main dev
        
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Prepare commit message
        echo "Release $RELEASE_TAG" > commit_msg.txt
        echo "" >> commit_msg.txt
        echo "$CHANGELOG_BODY" >> commit_msg.txt
        
        # Checkout main and squash
        git checkout main
        git read-tree -um HEAD ${{ github.sha }}
        git commit -F commit_msg.txt
        
        # Push to main
        git push origin main
        
        # Create and push the tag on main
        git tag $RELEASE_TAG HEAD
        git push origin $RELEASE_TAG

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.validate.outputs.tag }}
        files: dist/analyzer-standalone.html
        name: "Release ${{ needs.validate.outputs.tag }}"
        body: ${{ needs.validate.outputs.changelog }}
