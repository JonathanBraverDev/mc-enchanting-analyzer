name: Node.js CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        node-version: [22.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps
    - run: npm run build
    - run: npm test

  release:
    needs: build
    # Only run on pushes (tags are handled internally), never on PRs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Detect Tag and Environment
      id: meta
      run: |
        # Check if the current commit has a tag
        TAG_NAME=$(git tag --points-at HEAD | head -n 1)
        if [ -z "$TAG_NAME" ]; then
          echo "HAS_TAG=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        echo "HAS_TAG=true" >> $GITHUB_OUTPUT
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
        
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          echo "IS_OFFICIAL=true" >> $GITHUB_OUTPUT
        else
          echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          echo "IS_OFFICIAL=false" >> $GITHUB_OUTPUT
        fi

    - name: Extract Changelog
      if: steps.meta.outputs.HAS_TAG == 'true'
      id: changelog
      run: |
        BODY=$(node scripts/extract-changelog.js ${{ steps.meta.outputs.TAG_NAME }})
        echo "body<<EOF" >> $GITHUB_OUTPUT
        echo "$BODY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Use Node.js 22.x
      if: steps.meta.outputs.HAS_TAG == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - run: npm ci
      if: steps.meta.outputs.HAS_TAG == 'true'
      
    - name: Install Playwright Chromium
      if: steps.meta.outputs.HAS_TAG == 'true'
      run: npx playwright install chromium --with-deps

    - name: Standalone Build
      if: steps.meta.outputs.HAS_TAG == 'true'
      run: npm run build:standalone

    - name: Create GitHub Release
      if: steps.meta.outputs.HAS_TAG == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.meta.outputs.TAG_NAME }}
        files: dist/analyzer-standalone.html
        prerelease: ${{ steps.meta.outputs.PRERELEASE == 'true' }}
        body: ${{ steps.changelog.outputs.body }}
        name: "Portable Analyzer: ${{ steps.meta.outputs.TAG_NAME }}$([ \"${{ steps.meta.outputs.IS_OFFICIAL }}\" = \"true\" ] && echo \"\" || echo \" (Pre-release)\")"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
