name: Node.js CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        node-version: [22.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps
    - run: npm run build
    - run: npm test

  check-tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      has_tag: ${{ steps.check.outputs.has_tag }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - id: check
      run: |
        TAG_NAME=$(git tag --points-at HEAD | head -n 1)
        if [ -n "$TAG_NAME" ]; then
          echo "has_tag=true" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        else
          echo "has_tag=false" >> $GITHUB_OUTPUT
        fi

  release:
    needs: [build, check-tag]
    if: needs.check-tag.outputs.has_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Determine Type
      id: meta
      run: |
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          echo "TITLE=Portable Analyzer: ${{ needs.check-tag.outputs.tag_name }}" >> $GITHUB_OUTPUT
        else
          echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          echo "TITLE=Portable Analyzer: ${{ needs.check-tag.outputs.tag_name }} (Pre-release)" >> $GITHUB_OUTPUT
        fi

    - name: Extract Changelog
      id: changelog
      run: |
        BODY=$(node scripts/extract-changelog.js ${{ needs.check-tag.outputs.tag_name }})
        echo "body<<EOF" >> $GITHUB_OUTPUT
        echo "$BODY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps
    - name: Standalone Build
      run: npm run build:standalone

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.check-tag.outputs.tag_name }}
        files: dist/analyzer-standalone.html
        prerelease: ${{ steps.meta.outputs.PRERELEASE == 'true' }}
        body: ${{ steps.changelog.outputs.body }}
        name: ${{ steps.meta.outputs.TITLE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
